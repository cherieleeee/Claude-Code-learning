<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Emerald Editorial — Cover Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #3CD896;
    --ink: #0F1A5C;
    --paper: #F1E9D6;
    --display-font: 'Bodoni Moda', serif;
  }

  html, body { margin: 0; padding: 0; background: #0a0a0a; }

  section.slide {
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    overflow: hidden;
    position: relative;
    box-sizing: border-box;
  }

  .s1 {
    padding: 56px 110px;
    display: flex;
    flex-direction: column;
    text-align: center;
  }
  .s1-top {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 700; letter-spacing: 0.05em; font-size: 26px;
    flex-shrink: 0;
  }
  .s1-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 10px 0;
    min-height: 0;
  }
  .s1-line { color: var(--ink); }
  .s1-the { font-family: var(--display-font); font-weight: 800; font-size: 76px; line-height: 1; margin-bottom: -2px; }
  .s1-big {
    font-family: var(--display-font);
    font-weight: 900;
    font-size: 184px;
    line-height: 0.92;
    letter-spacing: -0.01em;
  }
  .s1-mid {
    display: flex; align-items: center; justify-content: center;
    gap: 32px;
    width: 100%;
    max-width: 1400px;
  }
  .s1-mid .rule {
    flex: 1; height: 22px; position: relative;
  }
  .s1-mid .rule::before, .s1-mid .rule::after {
    content: ""; position: absolute; left: 0; right: 0; height: 5px; background: var(--ink);
  }
  .s1-mid .rule::before { top: 2px; }
  .s1-mid .rule::after { bottom: 2px; }
  .s1-mid .of {
    font-family: var(--display-font); font-weight: 800;
    font-size: 68px; line-height: 1; padding: 0 6px;
  }
  .s1-credit {
    margin-top: 30px;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.18em;
  }
</style>
</head>
<body>
<deck-stage width="1920" height="1080" no-rail>

  <section class="slide s1" data-screen-label="01 Cover">
    <div class="s1-stage">
      <div class="s1-the">A Year</div>
      <div class="s1-big">BUILT TO</div>

      <div class="s1-mid">
        <span class="rule"></span>
        <span class="of">and</span>
        <span class="rule"></span>
      </div>

      <div class="s1-big">DELIVERED.</div>

      <div class="s1-credit">KEY ACHIEVEMENTS — PRESENTED TO SENIOR LEADERSHIP</div>
    </div>

    <div class="s1-top">
      <span>[YOUR NAME] · DIGITAL OPERATIONS</span>
      <span>MAY · MMXXVI</span>
    </div>
  </section>

</deck-stage>
<script src="deck-stage.js"></script>
</body>
</html>
